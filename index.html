<!doctype html>
<html lang="en" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="description" content="Ergosphere: daily health monitoring for astronauts. NASA Space Apps Challenge 2026.">
  <title>Ergosphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&family=Saira:wght@300;400;600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hatch.css">
  <link rel="stylesheet" href="css/body.css">
  <link rel="stylesheet" href="css/today.css">
  <link rel="stylesheet" href="css/log.css">
  <link rel="stylesheet" href="css/mission.css">
  <link rel="stylesheet" href="css/crew.css">
  <link rel="stylesheet" href="css/sync.css">
  <link rel="stylesheet" href="css/instrument.css">
  <link rel="stylesheet" href="css/meds.css">
  <link rel="stylesheet" href="css/duty.css">
  <link rel="stylesheet" href="css/telemetry.css">
  <link rel="stylesheet" href="css/future.css">
  <link rel="stylesheet" href="css/sources.css">
  <link rel="stylesheet" href="css/support.css">
  <link rel="stylesheet" href="css/family.css">
  <link rel="stylesheet" href="css/clinic.css">
  <link rel="stylesheet" href="css/fold.css">
  <link rel="stylesheet" href="css/brain.css">
  <link rel="stylesheet" href="css/alarm.css">
  <link rel="stylesheet" href="css/notify.css">
  <link rel="stylesheet" href="css/cupola.css">
  <link rel="stylesheet" href="css/devices.css">
  <link rel="stylesheet" href="css/role.css">
  <link rel="stylesheet" href="css/dark.css">
  <link rel="icon" href="assets/favicon.png" type="image/png">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <header class="masthead">
    <a class="mark" href="./" aria-label="Ergosphere Co, home">
      <img src="assets/logo-mark.webp" width="34" height="34" alt=""><span class="mark-name">Ergosphere <i>Co</i></span>
    </a>
    <div class="masthead-tools">
      <button type="button" class="sync-btn" data-action="sync" data-state="off" aria-label="Station sync">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg>
        <span data-sync-label>Sync</span><i class="sync-dot" aria-hidden="true"></i>
      </button>
      <time class="utc" data-utc>--:-- UTC</time>
      <a class="round-btn" href="#sources" aria-label="Sources: where every fact comes from" title="Sources"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"/><path d="M15 4v4h4M8 12h8M8 16h6"/></svg></a>
      <button type="button" class="round-btn lang-btn" data-action="lang" data-no-i18n aria-label="Cambiar a español" title="Español">ES</button>
      <button type="button" class="round-btn" data-action="theme" aria-label="Switch between day and night look">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      </button>
      <button type="button" class="round-btn signout-btn" data-action="lock" aria-label="Sign out" title="Sign out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg>
      </button>
    </div>
  </header>

  <div id="role-bar" class="role-bar" hidden></div>
  <main id="station" class="station" inert></main>

  <nav class="dock" aria-label="Main" inert>
    <a href="#ground" data-view="ground" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.500 2.700-6 6-6s6 2.500 6 6M14.500 14.300c.8-.2 1.600-.3 2.500-.3 2.800 0 4.500 2 4.500 5"/></svg>Crew</a>
    <a href="#crew" data-view="crew" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>Home</a>
    <a href="#today" data-view="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><polygon points="7,3 17,3 22,12 17,21 7,21 2,12"/><circle cx="12" cy="12" r="3.5"/></svg>Today</a>
    <a href="#log" data-view="log"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>Log</a>
    <a href="#mission" data-view="mission"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8"/><circle cx="12" cy="12" r="3"/></svg>Mission</a>
    <a href="#body" data-view="body"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><path d="M8 21v-7l-2-5h12l-2 5v7M12 9v12"/></svg>Body</a>
    <a href="#live" data-view="live"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>Live</a>
    <a href="#meds" data-view="meds"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="4" transform="rotate(-35 12 12)"/><path d="M12 8v8" transform="rotate(-35 12 12)"/></svg>Meds</a>
  </nav>

  <div id="hatch-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
