<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="description" content="Geosfera: daily health monitoring for astronauts. NASA Space Apps Challenge 2026.">
  <title>Geosfera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Saira:wght@300;400;600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hatch.css">
  <link rel="stylesheet" href="css/body.css">
  <link rel="stylesheet" href="css/today.css">
  <link rel="stylesheet" href="css/log.css">
  <link rel="stylesheet" href="css/mission.css">
  <link rel="stylesheet" href="css/instrument.css">
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <header class="masthead">
    <a class="mark" href="./" aria-label="Geosfera home">
      <img src="assets/mark.svg" width="22" height="22" alt="">
      <span>GEOSFERA</span>
    </a>
    <div class="masthead-tools">
      <time class="utc" data-utc>--:-- UTC</time>
      <button type="button" class="round-btn" data-action="lock" aria-label="Lock the app">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </button>
    </div>
  </header>

  <main id="station" class="station" inert></main>

  <nav class="dock" aria-label="Main" inert>
    <a href="#today" data-view="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><polygon points="7,3 17,3 22,12 17,21 7,21 2,12"/><circle cx="12" cy="12" r="3.5"/></svg>Today</a>
    <a href="#log" data-view="log"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>Log</a>
    <a href="#mission" data-view="mission"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8"/><circle cx="12" cy="12" r="3"/></svg>Mission</a>
    <a href="#body" data-view="body"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><path d="M8 21v-7l-2-5h12l-2 5v7M12 9v12"/></svg>Body</a>
  </nav>

  <div id="hatch-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
